name: Android Release & Security CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js and Firebase Tools
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Unit Tests & Android Lint
        run: gradle :app:testDebugUnitTest :app:lintDebug --console=plain

      - name: Build Signed Release AAB (when upload keystore secrets are configured)
        if: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
        run: |
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
          gradle :app:bundleRelease --console=plain
